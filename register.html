 <!DOCTYPE html>
 <html>
    <head>
        <title>This is  registration page</title>
    </head>
    <body>
        <h1>This is Registration Page</h1>
        <p>Login|<a href="register.html">Register</a></p>

        <form>
            <fieldset>
                <legend> Personal information</legend>
           <label><b>Name:</b></label>
            <input type="text"placeholder="Enter your name here">

            <br><br>

            <label><b>Email:</b></label>
            <input type="text"placeholder="Enter your email here">

            <br><br>

            <label><b>photo:</b></label>
            <input type="file">


            <label><b>Password:</b></label>
            <input type="password"placeholder="Enter your password here">

            <br><br>
            
            <label><b>ConfirmPassword:</b></label>
            <input type="password"placeholder="Enter your password again">

            </fieldset>

            <fieldset>

                <legend>Address Details</legend>

            <br><br>
            <label><b>Hno:</b></label>
            <input type="text"placeholder="Enter your house number ">

            <br><br>
            <label><b>street and village</b></label>
            <input type="text"placeholder="Enter your street and village name ">

            <br><br>
            <label><b>state:</b></label>
            <input type="text"placeholder="Enter your state ">

            <br><br>
            <label><b>Country:</b></label>
            <select>
                <option>India</option>
                <option>USA</option>
                <option>China</option>
            </select>

            <br><br>
            <label><b>Full Address:</b></label>
            <textarea row="5"></textarea>

            </fieldset>

            <fieldset>
                <legend>Products Intrested</legend>

                <label><b>Products Category:</b></label>
                <input type="checkbox" name="category"><label>Fashion</label>
                <input type="checkbox" name="category"><label>Electronics</label>
                <input type="checkbox" name="category"><label>Grocery</label>
                <input type="checkbox" name="category"><label>Mobiles</label>    

                <br><br>
            <label><b>Shopping for:</b></label>
            <input type="radio" name="shoppingfor"><label>for self</label>
            <input type="radio" name="shoppingfor"><label>for family</label>

            </fieldset>
            <br><br>
            <input type="submit" value="Submit">
        </form>
    </body>
 </html>
